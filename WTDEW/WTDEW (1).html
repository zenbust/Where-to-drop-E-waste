<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset = "UTF-8"/>
        <meta name = "viewport" content = "width=device_width, initial-scale = 1.0">
        <title>Where Drop E-Waste</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

        <link rel="stylesheet" href="WTDEW.css">
        <link rel="script" href="WTDEW.js">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

    </head>

    <body>
        <header class="top-header">
            <a class="Name">Where To Drop E-Waste</a>
            <input id="Search" class="Place" type="text" placeholder="Search for a location" oninput="showSuggestions(this.value)">
            <button class="SearchButton">Find</button>
            <div id="suggestions" class="suggestions-container"></div>
        </header>
    
        <div id="map"></div>
        <div id="centers-list"></div>
        

    </body>

        <script>
            var map = L.map('map').setView([13.848,100.443139], 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom: 19,attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
            
            const markerIcon = L.icon({
                iconUrl: 'file:///C:/Users/Pc/Downloads/285659_marker_map_icon.png', // Our custom marker image
                iconSize: [40, 40],
                iconAnchor: [20, 37],
                popupAnchor: [1, -34],
            });

            L.marker([13.848,100.443139], { icon: markerIcon }).addTo(map).bindPopup('TriamUdonSuksaPatthanakarn Nonthaburi')
            ;

        </script>
        <script src="Searchbar.js"></script>
</html>
